{% extends 'core/base.html' %}

{% block content %}
<form method="GET">
    <input type="text" name="q" value="{{ query }}" placeholder="ابحث عن وظيفة...">
    <button type="submit">بحث مباشر</button>
</form>

<hr>

{% if jobs %}
    <ul>
    {% for job in jobs %}
        <li style="margin-bottom: 15px; border-bottom: 1px solid #ddd; padding-bottom: 10px;">
            <strong>{{ job.title }}</strong> <br>
            <span>الشركة: {{ job.company }}</span> <br>
            <a href="{{ job.link }}" target="_blank">عرض الإعلان الأصلي 🔗</a>
        </li>
    {% endfor %}
    </ul>
{% elif query %}
    <p>لم يتم العثور على نتائج حالياً لـ "{{ query }}".</p>
{% endif %}

{% endblock %}
