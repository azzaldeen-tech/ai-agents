{% extends 'core/base.html' %}

{% block content %}

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="https://unpkg.com/lucide@latest"></script>

<div class="w-full mx-auto p-4 md:p-8 space-y-10">
    <div class="grid grid-cols-1 lg:grid-cols-2 gap-8">
        <div class="bg-surface-card p-8 rounded-3xl border border-stroke-soft shadow-sm h-[450px]">
            <h3 class="font-bold text-lg mb-4 text-content">نبض التوظيف الزمني</h3>
            <div class="h-[350px]">
                <canvas id="modernTimelineChart"></canvas>
            </div>
        </div>

        <div class="bg-surface-card p-8 rounded-3xl border border-stroke-soft shadow-sm h-[450px]">
            <h3 class="font-bold text-lg mb-4 text-content">المهارات الأكثر طلباً</h3>
            <div class="h-[350px]">
                <canvas id="modernSkillsChart"></canvas>
            </div>
        </div>

        <div class="lg:col-span-2 bg-surface-card p-8 rounded-3xl border border-stroke-soft shadow-sm flex flex-col md:flex-row gap-8 items-center h-auto min-h-[500px]">
            <div class="flex-1 w-full h-[400px]">
                 <h3 class="font-bold text-lg text-content mb-6 text-center">توزيع الفرص حسب القطاع</h3>
                <canvas id="modernCategoryChart"></canvas>
            </div>
            <div class="flex-1 w-full h-[400px]">
                <h3 class="font-bold text-lg text-content mb-6 text-center">متوسط الرواتب حسب القطاع</h3>
                <canvas id="modernSalaryRadarChart"></canvas>
            </div>
        </div>
    </div>
</div>

<script>
    // التأكد من أن البيانات تمرر بشكل صحيح
    const sLabels = {{ s_labels|safe }};
    const sData = {{ s_data|safe }};
    const cLabels = {{ c_labels|safe }};
    const cData = {{ c_data|safe }};
    const tLabels = {{ t_labels|safe }};
    const tData = {{ t_data|safe }};

    document.addEventListener('DOMContentLoaded', function() {
        // 1. رسم المهارات (الأعمدة)
        new Chart(document.getElementById('modernSkillsChart'), {
            type: 'bar',
            data: {
                labels: sLabels,
                datasets: [{
                    label: 'عدد مرات الطلب',
                    data: sData,
                    backgroundColor: '#10b981',
                    borderRadius: 8
                }]
            },
            options: {
                indexAxis: 'y', // لجعل المهارات مكتوبة بشكل عرضي مريح
                maintainAspectRatio: false,
                plugins: { legend: { display: false } }
            }
        });

        // 2. رسم القطاعات (الدائرة)
        new Chart(document.getElementById('modernCategoryChart'), {
            type: 'doughnut',
            data: {
                labels: cLabels,
                datasets: [{
                    data: cData,
                    backgroundColor: ['#3b82f6', '#f59e0b', '#10b981']
                }]
            },
            options: { maintainAspectRatio: false }
        });

        // 3. رسم المخطط الزمني
        new Chart(document.getElementById('modernTimelineChart'), {
            type: 'line', // لو لم يظهر، غيره لـ 'bar' لأن لديك تاريخ واحد فقط
            data: {
                labels: tLabels,
                datasets: [{
                    label: 'الوظائف المضافة',
                    data: tData,
                    borderColor: '#3b82f6',
                    fill: true,
                    backgroundColor: 'rgba(59, 130, 246, 0.1)',
                    tension: 0.4
                }]
            },
            options: { maintainAspectRatio: false }
        });
    });
</script>
