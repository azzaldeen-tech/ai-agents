{% extends 'core/base.html' %}

{% block content %}
<div class=" mx-auto px-4 py-8">

       <!-- Header -->
    {% include 'core/includes/navbar_analytics.html' %}

    <!-- الفلاتر (قوائم منسدلة تفاعلية) -->
    <div class="glass-card rounded-2xl p-6 bg-white shadow-sm mb-8 flex flex-wrap gap-4 items-center">
             <div class="flex flex-col gap-1.5">
                    <label for="city-filter" class="text-xs font-semibold text-gray-500 flex items-center gap-1">
                        <i data-lucide="map-pin" class="w-3.5 h-3.5"></i> التوزيع الجغرافي (المنطقة / المدينة)
                    </label>
                    <select id="city-filter" onchange="applyFilters()" class="w-full bg-white border border-gray-200 text-gray-700 px-3 py-2.5 rounded-xl text-sm focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500 transition-all cursor-pointer">
                        <option value="">كافة المدن والمناطق (الكل)</option>
                        {% for city in cities %}
                            <option value="{{ city.id }}">{{ city.name }}</option>
                        {% endfor %}
                    </select>
                </div>

                <!-- فلتر القطاعات -->
                <div class="flex flex-col gap-1.5">
                    <label for="category-filter" class="text-xs font-semibold text-gray-500 flex items-center gap-1">
                        <i data-lucide="layers" class="w-3.5 h-3.5"></i> التخصص والقطاع المهني
                    </label>
                    <select id="category-filter" onchange="applyFilters()" class="w-full bg-white border border-gray-200 text-gray-700 px-3 py-2.5 rounded-xl text-sm focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500 transition-all cursor-pointer">
                        <option value="">كافة القطاعات والمجالات (الكل)</option>
                        {% for cat in categories %}
                            <option value="{{ cat.id }}">{{ cat.name }}</option>
                        {% endfor %}
                    </select>
                </div>

        <!-- مؤشر التحميل الصامت (Loader) -->
        <div id="filter-loader" class="hidden text-sm text-purple-600 flex items-center gap-2 self-end mb-2 animate-pulse">
            <i data-lucide="loader-2" class="w-4 h-4 animate-spin"></i> جاري تحديث التنبؤ الذكي...
        </div>
    </div>

    <!-- Line Chart (الخط الزمني للوظائف المتوقع والفعلي) -->
    <div class="glass-card rounded-2xl p-6 hover-lift bg-white shadow-sm">
        <div class="flex justify-between items-center mb-6">
            <div>
                <div class="flex items-center gap-2">
                    <h3 class="text-lg font-bold text-gray-800">تحليل وتنبؤ حركة نمو الوظائف</h3>
                    <span class="bg-purple-100 text-purple-700 text-[10px] font-bold px-2 py-0.5 rounded-full flex items-center gap-1">
                        <i data-lucide="sparkles" class="w-3 h-3"></i> مدعوم بالذكاء الاصطناعي
                    </span>
                </div>
                <p class="text-xs text-gray-500">يشمل السجل التاريخي والتنبؤ الرياضي (ARIMA) للأشهر الثلاثة القادمة</p>
            </div>
        </div>
        <div class="h-80">
            <canvas id="trendsChart"></canvas>
        </div>
    </div>

</div>

<!-- تضمين مكتبة مكتبة الرموز الذكية إن لم تكن متضمنة في الـ base -->
<script src="https://unpkg.com/lucide@latest"></script>

<script>
    // -------------------------------------------------------------
    // [1] استقبال وقراءة بيانات الـ Context القادمة من Django (الحالة الأولى: Render)
    // -------------------------------------------------------------
    // نستخدم فلاتر دجانغو |safe لضمان تمرير المصفوفة كـ Array حقيقي في جافا سكريبت، مع وضع مصفوفة فارغة كبديل آمن
    const initialTimelineLabels = {{ ai_chart.labels|safe|default:"[]" }};
    const initialTimelineData = {{ ai_chart.data|safe|default:"[]" }};

    let trendsChart; // تعريف المتغير في النطاق العام (Global Scope) ليصبح قابلاً للتحديث لاحقاً عبر الـ AJAX

    // انتشال سياق الرسم بعد تحميل شجرة الـ DOM بالكامل
    document.addEventListener("DOMContentLoaded", function() {
        // تفعيل الرموز الإيضاحية
        if (typeof lucide !== 'undefined') lucide.createIcons();

        const trendsCtx = document.getElementById('trendsChart')?.getContext('2d');
        if(trendsCtx) {
            trendsChart = new Chart(trendsCtx, {
                type: 'line',
                data: {
                    labels: initialTimelineLabels,
                    datasets: [{
                        label: 'البيانات الفعلية والتنبؤية المتوقعة',
                        data: initialTimelineData,
                        borderColor: '#8b5cf6',
                        backgroundColor: 'rgba(139, 92, 246, 0.05)',
                        tension: 0.3,
                        fill: true,
                        // تلوين النقاط الثلاثة الأخيرة (التنبؤية المستقبلية) بالأصفر
                        pointBackgroundColor: function(context) {
                            const index = context.dataIndex;
                            const totalPoints = context.dataset.data.length;
                            return index >= (totalPoints - 3) ? '#f59e0b' : '#3b82f6';
                        },
                        pointRadius: function(context) {
                            const index = context.dataIndex;
                            const totalPoints = context.dataset.data.length;
                            return index >= (totalPoints - 3) ? 6 : 4;
                        }
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    scales: {
                        y: { beginAtZero: true }
                    },
                    plugins: {
                        tooltip: {
                            callbacks: {
                                label: function(context) {
                                    const index = context.dataIndex;
                                    const totalPoints = context.dataset.data.length;
                                    const val = context.raw;
                                    if (index >= (totalPoints - 3)) {
                                        return `🔮 متوقع : ${val} وظيفة`;
                                    }
                                    return `💼 فعلي: ${val} وظيفة`;
                                }
                            }
                        }
                    }
                }
            });
        }
    });

    // -------------------------------------------------------------
    // [2] دالة معالجة التحديث التفاعلي عند تغيير الفلاتر (الحالة الثانية: AJAX)
    // -------------------------------------------------------------

    function applyFilters() {

        const cityId = document.getElementById('city-filter').value;

        const categoryId = document.getElementById('category-filter').value;
        const loader = document.getElementById('filter-loader');

        // إظهار مؤشر التحميل
        if(loader) loader.classList.remove('hidden');

        // صياغة المعاملات
        const queryParams = new URLSearchParams({
            'city_id': cityId,
            'category_id': categoryId
        });

        const queryUrl = `?${queryParams.toString()}`;

        // إرسال طلب هادئ إلى السيرفر دون إعادة تحميل الصفحة
        fetch(queryUrl, {
            headers: {
                'x-requested-with': 'XMLHttpRequest',
                'Accept': 'application/json'
            }
        })
        .then(response => {
            if (!response.ok) throw new Error('حدث خطأ في الاتصال بالسيرفر');
            return response.json();
        })
        .then(resData => {
            // تحديث الرسم البياني بالبيانات المتنبأ بها حديثاً بناءً على الفلتر الجديد
            if(resData.success && resData.chart && trendsChart) {
                trendsChart.data.labels = resData.chart.labels || [];
                trendsChart.data.datasets[0].data = resData.chart.data || [];
                trendsChart.update(); // إعادة رسم المنحنى بشكل متحرك سلس
            }
        })
        .catch(err => {
            console.error('تعذر تحديث محرك التنبؤ التفاعلي:', err);
        })
        .finally(() => {
            // إخفاء مؤشر التحميل عند انتهاء المعالجة
            if(loader) loader.classList.add('hidden');
        });
    }
</script>
{% endblock %}
