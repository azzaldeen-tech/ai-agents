<!-- name, email,user_id=None, image_url=None,redirect_link=None -->
<a href="{{ redirect_link }}"  class="p-6 rounded-2xl border transition-all duration-300
            bg-secondary-bg border-main-border text-main-text
            hover:shadow-xl hover:scale-[1.03] text-center group">

    <div class="relative inline-block mb-4">
        <img src="{{ image }}"
             class="rounded-full object-cover border-4 border-emerald-500/20 group-hover:border-emerald-500 transition-colors duration-300"
             width="80" height="80" alt="{{ name }}">

        <span class="absolute bottom-1 right-1 w-4 h-4 bg-green-500 border-2 border-secondary-bg rounded-full"></span>
    </div>

    <h5 class="text-lg font-bold mb-1 group-hover:text-emerald-500 transition-colors">{{ name }}</h5>
    <p class="text-sm opacity-70 mb-4">{{ email }}</p>

    <span class="inline-block px-3 py-1 text-xs font-semibold rounded-full
                 bg-emerald-100 text-emerald-700
                 dark:bg-emerald-900/30 dark:text-emerald-400">
        ID: {{ id }}
    </span>
</a>
