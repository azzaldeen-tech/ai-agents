<button type="submit"
        class="w-full py-3 px-4 rounded-lg font-bold transition-all
               cursor-pointer
               {{ bg_color }}
               {{ content_color }}
               focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500
               flex items-center justify-center gap-2"
        {% if LANGUAGE_BIDI %} dir="rtl" {% endif %}>

    {# عرض الأيقونة إذا وجدت #}
    {% if icon %}
       <i data-lucide="{{ icon }}"
           class="w-5 h-5 stroke-current {% if LANGUAGE_BIDI %}rotate-180{% endif %}">
        </i>
    {% endif %}

    {# عرض النص (الـ label) #}
    <span class="">{{ label }}</span>
</button>
