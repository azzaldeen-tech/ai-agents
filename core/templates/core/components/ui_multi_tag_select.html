
<div class="form-control w-full mb-6" x-data="{}">
    {% if label %}
    <label class="label mb-1">
        <span class="text-sm font-semibold text-gray-700 tracking-wide">
            {{ label }}
        </span>
    </label>
    {% endif %}

    <div class="relative w-full mt-2">
        <select
            id="ts-{{ name }}"
            name="{{ name }}"
            multiple
            placeholder="{{ placeholder|default:'اختر المهارات...' }}"
            class="tom-select-target w-full"
        >
            {% for choice in choices %}
              <option value="{{ choice.id }}"
        {% if choice.id in selected_values %} selected {% endif %}>
        {{ choice.name }}
    </option>
            {% endfor %}
        </select>
    </div>
</div>

<script>
(function() {
    const setup = () => {
        const el = document.getElementById('ts-{{ name }}');
        if (el && !el.tomselect) {
            new TomSelect(el, {
                plugins: ['remove_button', 'clear_button'],
                persist: false,
                create: true,
                dir: 'rtl',
                openOnFocus: false,
                shouldOpen: function() {
                    return this.inputValue.length > 0;
                },
                onInitialize: function() {
                    this.control.classList.add(
                        'w-full',
                        'min-h-[3.2rem]',
                        'px-3',
                        'py-2',
                        'rounded-xl',
                        'bg-[#F8F8F5]',
                        'border',
                        'border-gray-200',
                        'shadow-sm',
                        'flex',
                        'items-center',
                        'gap-1',
                        'transition',
                        'duration-200'
                    );
                    const selectedItems = Array.from(el.querySelectorAll('option:checked')).map(opt => opt.value);
                    selectedItems.forEach(value => {
                        this.addItem(value, true); // true لمنع إطلاق أحداث التغيير عند التحميل
                    });
                    // تأثير التركيز
                    this.control.addEventListener('focusin', () => {
                        this.control.classList.add('ring-2','ring-primary/30','border-primary');
                    });
                    this.control.addEventListener('focusout', () => {
                        this.control.classList.remove('ring-2','ring-primary/30','border-primary');
                    });
                }
            });
        }
    };

    if (document.readyState === 'complete') setup();
    else window.addEventListener('load', setup);
    document.addEventListener('htmx:afterSwap', setup);
})();
</script>

<link href="https://cdn.jsdelivr.net/npm/tom-select@2.2.2/dist/css/tom-select.css" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/tom-select@2.2.2/dist/js/tom-select.complete.min.js"></script>

<style>

/* مسافة داخلية للحقل بالكامل */
.ts-control {
    padding-left: 12px !important;
    padding-right: 14px !important;
}

/* مسافة للنص الذي يكتبه المستخدم */
.ts-control input {
    margin-left: 4px;
    margin-right: 4px;
        padding-right: 6px !important;
}



/* مسافة بين الـ tags والحواف */






/* تحسين شكل الحقل */
.ts-wrapper.multi .ts-control {
    border-radius: 14px !important;
    cursor: text;
}

/* Tags */
.ts-control .item {
    background: linear-gradient(135deg, #6366f1, #4f46e5);

    padding: 6px 10px;
    border-radius: 10px !important;
    font-size: 0.85rem;
    margin: 4px;
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 6px 10px 6px 12px !important; /* أعلى يمين أسفل يسار */
    border-radius: 10px;
}

/* زر الحذف */
.ts-control .remove {
    opacity: 0.7;
    transition: 0.2s;
     padding: 0px !important;
}
.ts-control .remove:hover {
    opacity: 1;
}

/* القائمة المنسدلة */
.ts-dropdown {
    border-radius: 14px !important;
    border: none !important;
    box-shadow: 0 10px 25px rgba(0,0,0,0.08) !important;
    padding: 6px;
}

/* العناصر داخل القائمة */
.ts-dropdown .option {
    border-radius: 10px;
    padding: 8px 10px;
    transition: 0.2s;
}

.ts-dropdown .option:hover {
    background: #f1f5f9;
}

/* العنصر المحدد */
.ts-dropdown .active {
    background: #e0e7ff !important;
    color: #3730a3;
}
</style>
