<div class="flex flex-col gap-1.5 w-full py-2">
    {% if label %}
        <label {% if id %}for="{{ id }}"{% endif %}
               class="text-sm  transition-colors duration-200
               {% if error %}
                  text-error
               {% else %}
                  text-content
               {% endif %}">
            {{ label }}
        </label>
    {% endif %}

    <div class="relative group">
        {% if icon %}
            <div class="absolute inset-y-0 right-0 pr-3 flex items-center pointer-events-none text-content-muted">
                <i data-lucide="{{ icon }}"
                   class="w-5 h-5 stroke-current {% if LANGUAGE_BIDI %}rotate-180{% endif %}">
                </i>
            </div>
        {% endif %}

        <input
            type="{{ type }}"
            name="{{ name }}"
            id="{{ id }}"
            placeholder="{{ placeholder }}"
            value="{{ value }}"
            class="block w-full rounded-xl text-sm transition-all duration-200 outline-none
                   {{ bg_color }} {{ content_color }} placeholder-content-muted
                   {% if icon %}pr-10{% else %}px-4{% endif %} py-2.5
                   {% if error %}
                      border border-err focus:ring-4 focus:ring-err/10
                   {% else %}
                      border border-stroke-soft focus:border-primary focus:ring-4 focus:ring-primary/10
                   {% endif %}
                   disabled:opacity-50"

            {% if required %}required{% endif %}
        >
    </div>

    {% if error %}
        <p class="text-error text-xs font-medium mt-1">{{ error }}</p>
    {% elif help_text %}
        <p class="text-content-muted text-xs mt-1">{{ help_text }}</p>
    {% endif %}
</div>
