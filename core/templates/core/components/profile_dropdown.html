<div class="relative">
    <button onclick="toggleDrop('profileDrop')"
            class="w-9 h-9 rounded-xl overflow-hidden bg-brand text-white flex items-center justify-center font-bold text-[12px] hover:scale-105 transition-transform shadow-sm cursor-pointer border border-line-sub"
            aria-label="الملف الشخصي">

        {% if img_url %}
            <img src="{{ img_url }}" alt="{{ display_name }}" class="w-full h-full object-cover">
        {% else %}
            <span>{{ initials }}</span>
        {% endif %}
    </button>

    <div id="profileDrop" class="absolute top-full left-0 mt-2 w-52 bg-surface rounded-2xl shadow-xl shadow-fg/[0.04] p-1.5 opacity-0 -translate-y-2 pointer-events-none transition-all duration-200 z-50 border border-line">

        <div class="flex items-center gap-2.5 px-3 py-2.5 border-b border-line-sub mb-1">
            <div class="w-8 h-8 rounded-lg overflow-hidden bg-brand text-white flex items-center justify-center font-bold text-[11px] shrink-0">
                {% if img_url %}
                    <img src="{{ img_url }}" class="w-full h-full object-cover">
                {% else %}
                    {{ initials }}
                {% endif %}
            </div>
            <div class="min-w-0">
                <div class="text-[12px] font-semibold truncate text-fg">{{ display_name }}</div>
                <div class="text-[10px] text-fg-muted truncate">{{ sub_text }}</div>
            </div>
        </div>

<!--        <a href="{{ settings_url }}" class="w-full flex items-center gap-2.5 px-3 py-2 rounded-xl text-[12px] text-fg-sub hover:bg-raised hover:text-fg transition-colors">-->
<!--            <i class="fas fa-cog w-4 text-center text-[11px]"></i> الإعدادات-->
<!--        </a>-->

        <a href="{{ profile_url }}" class="w-full flex items-center gap-2.5 px-3 py-2 rounded-xl text-[12px] text-fg-sub hover:bg-raised hover:text-fg transition-colors">
            <i class="fas fa-user w-4 text-center text-[11px]"></i> الملف الشخصي
        </a>

        <a href="{{ support_url }}" class="w-full flex items-center gap-2.5 px-3 py-2 rounded-xl text-[12px] text-fg-sub hover:bg-raised hover:text-fg transition-colors">
            <i class="fas fa-question-circle w-4 text-center text-[11px]"></i> المساعدة
        </a>

        <div class="border-t border-line-sub my-1"></div>

        <form method="post" action="{% url logout_url %}">
            {% csrf_token %}
            <button type="submit" class="w-full flex items-center gap-2.5 px-3 py-2 rounded-xl text-[12px] text-coral hover:bg-coral-light transition-colors cursor-pointer">
                <i class="fas fa-sign-out-alt w-4 text-center text-[11px]"></i> تسجيل الخروج
            </button>
        </form>
    </div>
</div>
