<a href="{{ url|default:'javascript:history.back()' }}"
   class="inline-flex items-center gap-2 px-4 py-2 text-sm font-medium text-content opacity-70 hover:opacity-100 hover:bg-base rounded-xl
    transition-all border border-transparent hover:border-stroke-soft {{ extra_classes }}">
    <i data-lucide="arrow-right" class="w-4 h-4"></i>
    <span>{{ label|default:"Back" }}</span>
</a>
