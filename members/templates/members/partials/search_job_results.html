{% if jobs %}
    <div class="max-w-3xl mx-auto space-y-8 py-4">
        {% for job in jobs %}
            <div class="google-result-item">

                 {% url  'members:job_detail'  job.id as detail_url %}
                 {% job_search_item job redirect_link=detail_url %}
            </div>
        {% endfor %}
    </div>
{% else %}
    <div class="max-w-3xl mx-auto p-4">
        <p class="text-gray-600 bg-yellow-50 border border-yellow-200 p-4 rounded-lg">
            لا توجد نتائج مطابقة لبحثك.
        </p>
    </div>
{% endif %}
